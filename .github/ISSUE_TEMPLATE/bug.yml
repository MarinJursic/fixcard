name: Bug report
description: Report reproducible incorrect or unsafe behavior
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Never paste a real secret or proprietary log. Sanitize every example.
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: What happened, including exact sanitized output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Include a synthetic card and failure when possible.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Fixcard version
      placeholder: fixcard 0.1.0
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Linux, macOS, Windows, Other]
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed secrets, internal names, customer data, and private paths.
          required: true


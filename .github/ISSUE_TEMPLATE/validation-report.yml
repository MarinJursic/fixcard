name: Release-candidate validation report
description: Submit aggregated, sanitized Fixcard dogfood evidence without raw logs.
title: "[validation]: "
labels: [validation]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for testing Fixcard. Report only aggregated, sanitized metadata. Do not paste raw logs, credentials, private paths, internal hostnames, customer data, proprietary repository content, or the real repository name. Missing observations must stay missing rather than being estimated later.

        The exact Stage 3 build is `1.0.0-rc.4`. Confirm it with `fixcard --version`. Reports from newer candidates remain separate and are ineligible for this pilot unless a documented security-fix restart changes the preregistration.

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy and evidence confirmation
      options:
        - label: I removed raw failure text and identifying repository information.
          required: true
        - label: This report contains no credentials, customer data, or proprietary content.
          required: true
        - label: These are real-work observations, not synthetic incidents or reconstructed guesses.
          required: true

  - type: textarea
    id: study_context
    attributes:
      label: Study context
      description: Use the same random, non-identifying repository alias every week. Obtain the version from `fixcard --version`.
      value: |
        Anonymous repository alias:
        Fixcard version:
        Report sequence (for example, week 1 of 4):
        Observation period (YYYY-MM-DD through YYYY-MM-DD):
        Repository kind (public OSS / private work / private personal / mixed):
        Primary ecosystem:
        Pilot users with access to this repository:
        Weekly active pilot users:
    validations:
      required: true

  - type: textarea
    id: retrieval_counts
    attributes:
      label: Retrieval and workflow counts
      description: Count a strong result as relevant only when it was the correct first response for the real incident. List observed end-to-end lookup durations as comma-separated seconds.
      value: |
        Lookups attempted:
        Strong rank-one results:
        Relevant strong results:
        Irrelevant strong results:
        Correct abstentions / no strong result:
        Incorrect abstentions where a suitable card existed:
        End-to-end lookup durations in seconds:
        Incidents where Fixcard was used before browser, chat, or AI:
        Incidents where browser, chat, or AI was used first:
    validations:
      required: true

  - type: textarea
    id: capture_reuse_counts
    attributes:
      label: Capture, review, reuse, and retirement
      description: Authoring durations begin after the resolution is already known. Use comma-separated observed seconds; do not estimate missing measurements.
      value: |
        Cards authored:
        Authoring durations in seconds:
        Weekly active users who authored at least three cards:
        Reuses by original author:
        Reuses by another person:
        Shared cards submitted for normal pull-request review:
        Shared cards accepted through normal pull-request review:
        Shared cards changed or rejected during review:
        Cards retired or replaced:
    validations:
      required: true

  - type: textarea
    id: trust_privacy_counts
    attributes:
      label: Trust and privacy counts
      description: Report suspected security details privately. Public counts must contain no secret values, raw logs, commands, paths, or internal names.
      value: |
        Secret-scanner catches before save:
        Secret-scanner false positives:
        Real secrets found after save:
        Misleading-certainty incidents:
        Unsafe-action incidents:
        Users asked to explain how Fixcard differs from history, Atuin, Recall, Navi, or a README:
        Users who could explain a meaningful difference:
    validations:
      required: true

  - type: dropdown
    id: serious_incident
    attributes:
      label: Serious secret exposure, misleading-certainty, or unsafe-action incident
      options:
        - "No"
        - "Yes — I will report details privately"
    validations:
      required: true

  - type: dropdown
    id: maintenance_burden
    attributes:
      label: Maintenance burden for this repository
      options:
        - Acceptable
        - Unacceptable
        - Too early to judge
    validations:
      required: true

  - type: textarea
    id: friction
    attributes:
      label: Most important friction or surprise
      description: Describe workflow friction without including repository-private text. Include scanner false-positive burden when relevant.
    validations:
      required: true

  - type: textarea
    id: value_and_difference
    attributes:
      label: Concrete value and differentiation observed
      description: What became faster or safer, and why was this not adequately served by history, Atuin, Recall, Navi, or repository documentation? A report that Fixcard provided no distinct value is equally useful.
    validations:
      required: true

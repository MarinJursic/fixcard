name: Release-candidate validation report
description: Submit aggregated, sanitized Fixcard dogfood evidence without raw logs.
title: "[validation]: "
labels: [validation]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for testing Fixcard. Report only aggregated, sanitized metadata. Do not paste raw logs, credentials, private paths, internal hostnames, customer data, or proprietary repository content.

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed raw failure text and private repository information.
          required: true
        - label: This report contains no credentials or customer data.
          required: true

  - type: dropdown
    id: repository_kind
    attributes:
      label: Repository kind
      options:
        - Public open source
        - Private work project
        - Private personal project
        - Other or mixed
    validations:
      required: true

  - type: input
    id: ecosystem
    attributes:
      label: Primary ecosystem
      description: Examples include Rust/Cargo, JavaScript/pnpm, Python/uv, Go, or mixed.
    validations:
      required: true

  - type: input
    id: period
    attributes:
      label: Observation period
      placeholder: 2026-08-03 through 2026-08-10
    validations:
      required: true

  - type: textarea
    id: retrieval_counts
    attributes:
      label: Retrieval counts
      description: Provide integers for each line. Count a strong result as relevant only when it was the right first response for the actual incident.
      value: |
        Lookups attempted:
        Strong rank-one results:
        Relevant strong results:
        Irrelevant strong results:
        Correct abstentions / no strong result:
        Incorrect abstentions where a suitable card existed:
    validations:
      required: true

  - type: textarea
    id: capture_counts
    attributes:
      label: Capture and reuse
      description: Durations begin after the resolution is already known. Approximate values are acceptable; do not invent missing measurements.
      value: |
        Cards authored:
        Authoring durations in seconds:
        Reuses by original author:
        Reuses by another person:
        Cards retired or replaced:
    validations:
      required: true

  - type: dropdown
    id: safety_incident
    attributes:
      label: Serious secret exposure or unsafe-action incident
      options:
        - No
        - Yes — I will report details privately
    validations:
      required: true

  - type: textarea
    id: friction
    attributes:
      label: Most important friction or surprise
      description: Describe workflow friction without including repository-private text.
    validations:
      required: true

  - type: textarea
    id: value
    attributes:
      label: Concrete value observed
      description: What became faster or safer? A report that Fixcard provided no value is equally useful.
    validations:
      required: true

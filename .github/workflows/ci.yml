name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Format, lint, test, docs, package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Install pinned toolchain
        run: rustup show active-toolchain
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Validate GitHub issue forms
        run: ruby scripts/check_issue_forms.rb
      - name: Validate research operations kit
        run: ruby scripts/check_research_kit.rb
      - name: Lint all targets and features
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Test all features
        run: cargo test --workspace --all-features --locked
      - name: Build documentation with warnings denied
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps --locked
      - name: Build optimized binary
        run: cargo build --release -p fixcard --locked
      - name: Check terminal restoration on termination
        run: python3 scripts/check_terminal_restore.py target/release/fixcard
      - name: Check process startup target
        run: python3 scripts/check_startup.py target/release/fixcard 75
      - name: Lint teaching cards
        run: cargo run -q -p fixcard -- lint examples/repository/.fixcards
      - name: Lint Markdown
        run: npx --yes markdownlint-cli2@0.23.2 'README.md' 'docs/**/*.md' 'examples/**/*.md' 'research/**/*.md' '*.md' '#target' '#.git'

  cross-platform:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install pinned toolchain
        run: rustup show active-toolchain
      - name: Test workspace
        run: cargo test --workspace --all-features --locked
      - name: Build optimized binary for terminal safety
        if: runner.os == 'macOS'
        run: cargo build --release -p fixcard --locked
      - name: Check macOS terminal restoration
        if: runner.os == 'macOS'
        run: python3 scripts/check_terminal_restore.py target/release/fixcard

  msrv:
    name: Minimum supported Rust 1.85
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: rustup toolchain install 1.85.0 --profile minimal
      - run: cargo +1.85.0 check --workspace --all-targets --all-features --locked

  performance:
    name: 1,000-card performance gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install pinned toolchain
        run: rustup show active-toolchain
      - run: cargo bench -p fixcard-core --bench search_1000 --locked

  coverage:
    name: Coverage artifact
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: rustup component add llvm-tools-preview
      - run: cargo install cargo-llvm-cov --version 0.8.7 --locked
      - run: cargo llvm-cov --workspace --all-features --locked --lcov --output-path lcov.info
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-lcov
          path: lcov.info
          if-no-files-found: error
          retention-days: 14

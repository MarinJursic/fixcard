[workspace]
members = [
  "crates/fixcard-cli",
  "crates/fixcard-core",
  "crates/fixcard-git",
  "crates/fixcard-lint",
]
resolver = "3"

[workspace.package]
version = "1.0.0-rc.1"
authors = ["Fixcard contributors"]
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/MarinJursic/fixcard"
homepage = "https://github.com/MarinJursic/fixcard"
keywords = ["cli", "debugging", "git", "knowledge", "troubleshooting"]
categories = ["command-line-utilities", "development-tools"]

[workspace.dependencies]
anyhow = "1.0"
assert_cmd = "2.0"
clap = { version = "4.5", features = ["derive", "wrap_help"] }
dialoguer = "0.12"
jiff = { version = "0.2", features = ["serde"] }
predicates = "3.1"
proptest = "1.7"
regex = "1.11"
semver = { version = "1.0", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml_ng = "0.10"
strip-ansi-escapes = "0.2"
tempfile = "3.20"
thiserror = "2.0"
toml = "0.9"
unicode-normalization = "0.1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
rust_2018_idioms = { level = "deny", priority = -1 }
unused_lifetimes = "deny"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
todo = "deny"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
